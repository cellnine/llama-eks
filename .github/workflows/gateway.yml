name: gateway

on:
  pull_request:
    paths:
      - "gateway/**"
      - "charts/gateway/**"
      - ".github/workflows/gateway.yml"
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "charts/gateway/**"
      - ".github/workflows/gateway.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: gateway/go.sum
      - run: go vet ./...
      - run: go test ./...

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: gateway
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/llama-eks-gateway:latest
            ${{ steps.ecr.outputs.registry }}/llama-eks-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
