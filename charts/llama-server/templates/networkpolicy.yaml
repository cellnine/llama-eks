{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "llama-server.fullname" . }}-allow-gateway-only
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llama-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "llama-server.name" . }}
  policyTypes:
    - Ingress
  ingress:
    # Only the gateway may reach llama-server. The podSelector with no other
    # ingress rules denies everything else.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - port: {{ .Values.llamaArgs.port }}
          protocol: TCP
{{- end }}
